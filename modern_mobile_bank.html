
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Banking - Modern UI</title>

<!-- فونت فارسی Vazirmatn -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef2ff;
  --card:rgba(255,255,255,.75);
  --blue:#3b82f6;
  --indigo:#6366f1;
  --purple:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
  --gold1:#fff9ea;
  --gold2:#ffe6a7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Vazirmatn',sans-serif;
}

body{
  background:
  radial-gradient(circle at top left,#dbeafe,transparent 35%),
  radial-gradient(circle at top right,#ede9fe,transparent 35%),
  #f8fafc;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:30px 15px;
}

.container{
  width:100%;
  max-width:430px;
}

.header{
  text-align:center;
  margin-bottom:24px;
}

.header h2{
  font-size:26px;
  color:#111827;
}

.header p{
  color:#6b7280;
  margin-top:6px;
}

.grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:18px;
}

/* کارت‌ها */
.card{
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:32px;
  box-shadow:
  0 25px 60px rgba(99,102,241,.12),
  0 10px 25px rgba(0,0,0,.05);
  padding:18px;
  position:relative;
  overflow:hidden;
}

/* کارت موجودی */
.balance{
  grid-column:1 / span 2;
  min-height:220px;
  background:linear-gradient(145deg,#001c6d,#003cff);
  color:white;
}
.balance::after{
  content:"";
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  bottom:-250px;
  right:-100px;
}
.balance .wallet-icon{
  font-size:40px;
}

/* کارت بانکی */
.bank-card{
  grid-column:1 / span 2;
  min-height:220px;
  background:linear-gradient(135deg,#6d5dfc,#4f46e5);
  color:white;
}
.bank-card .chip{
  width:50px;
  height:35px;
  background:#f3f4f6;
  border-radius:6px;
  margin-bottom:20px;
}
.bank-card .bank-name{
  font-size:18px;
  font-weight:600;
}
.bank-card .number{
  margin-top:15px;
  letter-spacing:2px;
  font-size:18px;
}
.bank-card .holder{
  margin-top:8px;
  font-size:16px;
}

/* کارت سطح حساب طلایی */
.account-level{
  background:linear-gradient(135deg,var(--gold1),var(--gold2));
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:200px;
}
.account-level .crown{
  font-size:70px;
  filter:drop-shadow(0 15px 25px rgba(255,193,7,.4));
}
.account-level h1{
  font-size:24px;
  margin-top:6px;
}
.account-level p{
  font-size:16px;
  margin-top:4px;
  color:#111827;
}

/* کارت انتقال وجه */
.transfer{
  grid-column:1 / span 2;
}
.transfer h2{
  margin-bottom:12px;
  font-size:20px;
}
.transfer input{
  height:60px;
  border:none;
  background:#f8fafc;
  border-radius:20px;
  padding:0 20px;
  margin-top:12px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.05);
}
.transfer button{
  height:62px;
  margin-top:15px;
  border:none;
  border-radius:22px;
  background:linear-gradient(90deg,#8b5cf6,#3b82f6);
  color:white;
  font-size:18px;
  font-weight:700;
  box-shadow:0 15px 35px rgba(99,102,241,.35);
}

/* کارت دریافتی و پرداختی */
.transactions{
  min-height:180px;
}
.transactions .title{
  margin-bottom:10px;
  font-size:14px;
  color:#6b7280;
}
.transaction-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:16px;
}
.transaction-item.income{
  color:var(--green);
  font-weight:600;
}
.transaction-item.expense{
  color:var(--red);
  font-weight:600;
}

/* صاحب حساب */
.account-holder{
  min-height:120px;
}
.account-holder .title{
  color:#6b7280;
  margin-bottom:6px;
}
.account-holder .value{
  font-size:20px;
  font-weight:600;
}

/* SVG نمودار */
svg{width:100%; height:40px; margin-top:6px;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>سلام، سید 👋</h2>
    <p>به موبایل بانک خوش اومدی</p>
  </div>

  <div class="grid">

    <!-- موجودی -->
    <div class="card balance">
      <div class="wallet-icon">💳</div>
      <span>موجودی حساب</span>
      <h1>۱۲۵,۴۵۰,۰۰۰</h1>
      <small>تومان</small>
    </div>

    <!-- کارت بانکی -->
    <div class="card bank-card">
      <div class="chip"></div>
      <div class="bank-name">Rabbit Bank</div>
      <div class="number">6037 •••• •••• 9876</div>
      <div class="holder">Seyed Hosseini</div>
    </div>

    <!-- کارت انتقال وجه -->
    <div class="card transfer">
      <h2>انتقال وجه</h2>
      <input placeholder="شماره کارت مقصد">
      <input placeholder="مبلغ (تومان)">
      <button>✈ انتقال وجه</button>
    </div>

    <!-- دریافتی و پرداختی -->
    <div class="card transactions">
      <div class="title">آخرین تراکنش‌ها</div>
      <div class="transaction-item income">واریز حقوق +۱۵,۰۰۰,۰۰۰</div>
      <svg viewBox="0 0 200 50">
        <path d="M0 35 Q30 10 60 25 T120 15 T200 8" stroke="#22c55e" stroke-width="5" fill="none"/>
      </svg>
      <div class="transaction-item expense">خرید اینترنتی -۴۵۰,۰۰۰</div>
      <svg viewBox="0 0 200 50">
        <path d="M0 20 Q30 35 60 15 T120 30 T200 10" stroke="#ef4444" stroke-width="5" fill="none"/>
      </svg>
      <div class="transaction-item expense">انتقال وجه -۲,۰۰۰,۰۰۰</div>
    </div>

    <!-- سطح حساب طلایی -->
    <div class="card account-level">
      <div class="crown">👑</div>
      <h1>طلایی</h1>
      <p>۲۴۸۰ امتیاز</p>
    </div>

    <!-- صاحب حساب -->
    <div class="card account-holder">
      <div class="title">صاحب حساب</div>
      <div class="value">سید حسینی</div>
    </div>

  </div>
</div>
</body>
</html>
